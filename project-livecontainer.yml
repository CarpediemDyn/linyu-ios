name: LinYuLiveContainer
options:
  bundleIdPrefix: org.linyu.prototype
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LINYU_LIVECONTAINER"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LINYU_APP_GROUP: ""
targets:
  LinYuIOS:
    type: application
    platform: iOS
    scheme:
      testTargets: [LinYuIOSTests]
    sources:
      - path: LinYuIOS
        excludes: [Info.plist, LinYuIOS.entitlements]
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: LinYuIOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.linyu.prototype.livecontainer
        PRODUCT_NAME: LinYuIOS
        PRODUCT_MODULE_NAME: LinYuIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
  LinYuIOSTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.linyu.prototype.livecontainer.tests
    sources:
      - path: LinYuIOSTests
      - path: CoreTests
    dependencies:
      - target: LinYuIOS
