name: Build LiveContainer IPA
run-name: ${{ inputs.preflight_only && 'Release preflight (no IPA)' || inputs.tests_only && 'iOS regression tests (no IPA)' || 'Build LiveContainer IPA' }}
on:
  workflow_dispatch:
    inputs:
      tests_only:
        description: Run all iOS tests without a device build, signing or IPA
        type: boolean
        required: true
        default: true
      preflight_only:
        description: Run Ubuntu checks only; never allocate a Mac or generate an IPA
        type: boolean
        required: true
        default: false
      expected_sha:
        description: Frozen release commit SHA (preflight must match)
        type: string
        required: true
      runner:
        description: Standard macOS build image
        type: choice
        required: true
        default: macos-26-intel
        options: [macos-26, macos-26-intel, macos-15, macos-15-intel]
      simulator:
        description: Simulator device family
        type: choice
        required: true
        default: iPhone
        options: [iPhone, iPad]
permissions:
  contents: read
concurrency:
  group: linyu-final-ipa
  cancel-in-progress: false
jobs:
  wait_for_service:
    name: Wait for GitHub Actions recovery
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait up to 45 minutes for the official Actions status
        run: |
          python3 -u - <<'PY'
          import json, time, urllib.request
          deadline = time.monotonic() + 45 * 60
          while time.monotonic() < deadline:
              try:
                  request = urllib.request.Request('https://www.githubstatus.com/api/v2/summary.json', headers={'Cache-Control': 'no-cache', 'User-Agent': 'LinYu-build-status'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      summary = json.load(response)
                  state = next((item['status'] for item in summary['components'] if item['name'] == 'Actions'), 'unknown')
                  print('Official GitHub Actions status:', state, flush=True)
                  if state == 'operational':
                      print('Status is operational; continue to one Mac build attempt.', flush=True)
                      break
              except Exception as error:
                  print('Could not read public status:', error, flush=True)
              time.sleep(60)
          else:
              raise SystemExit('Recovery wait expired; no Mac build was started.')
          PY
  preflight:
    needs: wait_for_service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen source and release configuration
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 scripts/release_preflight.py
          git diff --check
      - name: Packaging regression tests (including POSIX paths)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Mock transaction core and settlement isolation
        run: |
          swift --version
          swift test
  build:
    if: ${{ !inputs.preflight_only }}
    needs: [wait_for_service, preflight]
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: Validate IPA packaging logic
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test transaction core
        run: swift test
      - name: Generate container project
        run: xcodegen generate --spec project-livecontainer.yml
      - name: Select simulator
        env:
          LINYU_SIMULATOR_FAMILY: ${{ inputs.simulator }}
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "SimRuntime.iOS-" in runtime for d in devices if d["name"].startswith(os.environ.get("LINYU_SIMULATOR_FAMILY") or "iPhone") and d.get("isAvailable", False)))')
          echo "IOS_SIMULATOR_UDID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Compile and run iOS tests
        run: |
          xcodebuild -project LinYuLiveContainer.xcodeproj -scheme LinYuIOS \
            -configuration Debug -sdk iphonesimulator -destination "id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath work/SimulatorBuild -resultBundlePath work/ContainerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Export screenshots from XCTest
        if: always()
        run: |
          if [ -d work/ContainerTests.xcresult ]; then
            xcrun xcresulttool export attachments --path work/ContainerTests.xcresult --output-path work/visual-checks
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LinYu-iOS-Visual-Checks
          path: work/visual-checks
          if-no-files-found: warn
      - name: Build physical iPhone app
        if: ${{ !inputs.tests_only }}
        run: |
          xcodebuild -project LinYuLiveContainer.xcodeproj -scheme LinYuIOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath work/DeviceBuild ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Ad-hoc seal and validate IPA
        if: ${{ !inputs.tests_only }}
        run: |
          APP=work/DeviceBuild/Build/Products/Release-iphoneos/LinYuIOS.app
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict "$APP"
          python3 scripts/package_ipa.py --app "$APP" \
            --output work/deliverables/LinYu-LiveContainer.ipa --report work/deliverables/BUILD_REPORT.json
          git rev-parse HEAD > work/deliverables/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.tests_only }}
        with:
          name: LinYu-LiveContainer-IPA
          path: work/deliverables/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LinYu-LiveContainer-XCTest
          path: work/ContainerTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

